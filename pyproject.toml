[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tapestry-client"
version = "0.2.0"
description = "Reference async client library for the Tapestry platform contracts."
requires-python = ">=3.13"
dependencies = [
    "filelock>=3.16.0",
    "httpx>=0.28.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "respx>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tapestry_client"]

[tool.hatch.build.targets.wheel.force-include]
"src/tapestry_client/py.typed" = "tapestry_client/py.typed"

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
src = ["src", "tests", "unit_tests", "tools"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["tapestry_client"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests", "unit_tests"]
markers = [
    "unit: isolated transport, schema, and webhook rules",
    "isolated_unit: proven unit boundary without application or I/O dependencies",
    "integration: real filesystem and runner components",
]
addopts = [
    "-ra",
    "--strict-markers",
    "-m", "not isolated_unit",
    "--cov=tapestry_client",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["tapestry_client"]
branch = true
