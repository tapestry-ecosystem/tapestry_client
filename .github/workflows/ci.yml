name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Sync
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check
      - name: Type check
        run: uv run mypy src tests
      - name: Test
        run: uv run pytest --no-cov -v
